<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Workbuddy 工作台</title>
<style>
  :root{
    --green:#1F3A52; --green2:#2E5A7A; --mint:#4F8CBF; --mint-soft:#E8F0F6;
    --white:#FBFCFD; --ink:#1E2B36; --sub:#788794; --line:#DEE6ED;
    --red:#BE3B2E; --green-up:#2E8B6F; --shadow:0 8px 24px rgba(31,58,82,.12);
    --tint:#E4ECF2;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Segoe UI",system-ui,-apple-system,BlinkMacSystemFont,Roboto,Helvetica,Arial,sans-serif;
    color:var(--ink); background:#EEF3F7; font-size:15px; line-height:1.6;
    -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale; text-rendering:optimizeLegibility;
  }
  button{font-family:inherit;cursor:pointer}
  .btn{
    border:none;border-radius:10px;padding:9px 14px;font-size:14px;font-weight:600;
    background:var(--mint-soft);color:var(--green);min-height:44px;transition:.15s;
  }
  .btn:hover{filter:brightness(.97)}
  .btn.primary{background:linear-gradient(135deg,var(--green),var(--mint));color:#fff}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--sub)}
  .btn.sm{min-height:34px;padding:6px 10px;font-size:13px;border-radius:8px}
  .btn.danger{background:#F7E4E1;color:var(--red)}
  input,select,textarea{
    font-family:inherit;font-size:16px;padding:9px 11px;border:1px solid var(--line);
    border-radius:9px;background:var(--white);color:var(--ink);width:100%;outline:none;transition:.15s;
  }
  input:focus,select:focus,textarea:focus{border-color:var(--mint);box-shadow:0 0 0 3px var(--mint-soft)}
  textarea{resize:vertical;min-height:64px}
  label.fld{display:block;margin-bottom:10px}
  label.fld>span{display:block;font-size:12px;color:var(--sub);margin-bottom:4px;font-weight:600}

  /* layout */
  .app{display:flex;min-height:100vh}
  .sidebar{
    width:232px;flex:0 0 232px;background:linear-gradient(165deg,var(--green),var(--green2));color:#D4E2EC;
    display:flex;flex-direction:column;position:sticky;top:0;height:100vh;
    padding:18px 12px;overflow-y:auto;
  }
  .brand{display:flex;align-items:center;gap:10px;padding:4px 8px 16px;font-weight:700;color:#fff;font-size:17px}
  .brand svg{width:24px;height:24px;flex:0 0 24px}
  .navitem{
    display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:11px;
    color:#D4E2EC;font-weight:600;font-size:14.5px;margin-bottom:3px;cursor:pointer;
    border:none;background:transparent;width:100%;text-align:left;transition:.15s;
  }
  .navitem svg{width:19px;height:19px;flex:0 0 19px;opacity:.85}
  .navitem:hover{background:rgba(255,255,255,.08)}
  .navitem.active{background:linear-gradient(135deg,var(--mint),#6FA3CC);color:#16222E}
  .navitem .del{margin-left:auto;opacity:0;font-size:12px;color:#ffb4ae}
  .navitem:hover .del{opacity:.8}
  .navitem .del:hover{opacity:1}
  .navitem .renamebtn{margin-left:6px;opacity:.5;font-size:11.5px;color:#C6DCEA;cursor:pointer;flex:0 0 auto;border:1px solid rgba(255,255,255,.16);border-radius:6px;padding:1px 6px;transition:.15s}
  .navitem .renamebtn:hover{opacity:1;background:rgba(255,255,255,.14)}
  .navgroup{position:relative}
  .navgroup.dragging{opacity:.55}
  .navgroup.dragging .navitem{background:var(--mint-soft);color:#16222E;box-shadow:0 6px 16px rgba(22,34,46,.22)}
  .grip{cursor:grab;opacity:.35;font-size:15px;line-height:1;flex:0 0 auto;touch-action:none;user-select:none;padding:0 2px;transition:.15s}
  .grip:hover{opacity:.7}
  .grip:active{cursor:grabbing;opacity:1}
  .subnav{display:none;flex-direction:column;padding:2px 0 8px 30px}
  .subnav.open{display:flex;animation:fadeIn .25s}
  .subitem{
    padding:7px 10px;border-radius:8px;color:#bcd2c8;font-size:13px;cursor:pointer;
    background:transparent;border:none;text-align:left;width:100%;display:flex;align-items:center;gap:6px;
  }
  .subitem:hover{background:rgba(255,255,255,.07);color:#fff}
  .subitem.active{color:#fff;font-weight:700}
  .subitem .del{margin-left:auto;opacity:0;font-size:11px;color:#ffb4ae}
  .subitem:hover .del{opacity:.7}
  .subitem .renamebtn{margin-left:auto;opacity:.55;font-size:10.5px;color:#bcd2c8;cursor:pointer;flex:0 0 auto;border:1px solid rgba(255,255,255,.15);border-radius:6px;padding:0 5px;transition:.15s}
  .subitem .renamebtn:hover{opacity:1;background:rgba(255,255,255,.1)}
  .sidefoot{margin-top:auto;padding-top:14px;border-top:1px solid rgba(255,255,255,.12);display:flex;gap:8px;flex-wrap:wrap}
  .sidefoot .btn{background:rgba(255,255,255,.12);color:#D4E2EC;font-size:12.5px;flex:1;min-width:90px}
  .sidefoot .btn:hover{background:rgba(255,255,255,.18)}

  .main{flex:1;min-width:0;display:flex;flex-direction:column}
  header.top{
    background:linear-gradient(135deg,#3E6E96,#6FA3CC);color:#fff;
    padding:16px 22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
    position:sticky;top:0;z-index:5;
  }
  header.top h1{margin:0;font-size:19px;font-weight:700}
  header.top .crumb{font-size:13px;opacity:.85;font-weight:500}
  .badges{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .badge{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.18);
    padding:6px 11px;border-radius:20px;font-size:12.5px;font-weight:600}
  .dot{width:8px;height:8px;border-radius:50%;background:#7ee0a8}
  .badge.off .dot{background:#ffb4ae}
  .topbtns{display:flex;gap:8px}
  .topbtns .btn{background:rgba(255,255,255,.2);color:#fff;font-size:13px;min-height:38px}
  .topbtns .btn:hover{background:rgba(255,255,255,.3)}
  .hamburger{display:none;background:rgba(255,255,255,.2);color:#fff;border:none;border-radius:10px;width:42px;height:42px;align-items:center;justify-content:center}

  .content{padding:22px;max-width:1080px;width:100%;margin:0 auto;animation:fadeIn .3s}
  .section-title{font-size:16px;font-weight:700;margin:0 0 12px;display:flex;align-items:center;gap:8px;letter-spacing:.3px}
  .section-title svg{width:18px;height:18px;color:var(--mint)}
  .card{background:var(--white);border-radius:20px;padding:18px;box-shadow:var(--shadow);
    margin-bottom:18px;animation:rise .3s;}
  .card:hover{box-shadow:0 10px 28px rgba(46,71,62,.12)}
  .grid{display:grid;gap:14px}
  .g2{grid-template-columns:repeat(2,1fr)}
  .g3{grid-template-columns:repeat(3,1fr)}
  .g4{grid-template-columns:repeat(4,1fr)}
  .stat{background:var(--mint-soft);border-radius:14px;padding:16px}
  .stat .num{font-size:26px;font-weight:800;color:var(--green);font-variant-numeric:tabular-nums}
  .stat .lab{font-size:12.5px;color:var(--sub);font-weight:600;margin-top:2px}
  .progress{height:9px;background:var(--tint);border-radius:6px;overflow:hidden;margin-top:8px}
  .progress>i{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--mint));border-radius:6px}
  .pill{display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;border-radius:20px}
  .pill.high{background:#F7E4E1;color:var(--red)}
  .pill.mid{background:#fff3df;color:#d9912b}
  .pill.low{background:var(--mint-soft);color:var(--green)}
  .pill.in{background:#E8F0F6;color:var(--green-up)}
  .pill.out{background:#F7E4E1;color:var(--red)}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
  .row>*{flex:1;min-width:120px}
  .list-item{display:flex;align-items:flex-start;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
  .list-item:last-child{border-bottom:none}
  .list-item .body{flex:1;min-width:0}
  .list-item .meta{font-size:12px;color:var(--sub);margin-top:3px;display:flex;gap:8px;flex-wrap:wrap}
  .chk{width:22px;height:22px;border-radius:7px;border:2px solid var(--mint);flex:0 0 22px;
    display:flex;align-items:center;justify-content:center;background:#fff;color:#fff;font-size:14px;font-weight:800;margin-top:1px}
  .chk.on{background:var(--mint)}
  .empty{text-align:center;color:var(--sub);padding:28px;font-size:14px}
  .tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .tab{padding:8px 14px;border-radius:10px;background:var(--mint-soft);color:var(--green);font-weight:600;font-size:13.5px;border:none}
  .tab.active{background:var(--green);color:#fff}
  /* heatmap */
  .heat{display:flex;gap:3px;flex-wrap:wrap}
  .heat.week{gap:6px}
  .hcell{width:15px;height:15px;border-radius:4px;background:var(--tint)}
  .hcell.on{background:var(--mint)}
  .heat.year .hcell{width:11px;height:11px}
  .heat.month{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;max-width:280px}
  .heat.month .hcell{width:auto;height:26px;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--sub)}
  .heat.month .hcell.on{color:#16222E;font-weight:700}
  .heat.month .hcell.head{background:transparent;font-weight:700;color:var(--sub)}
  /* 英语打卡月历网格（独立类名，避免与月计划日历冲突） */
  .en-cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;max-width:340px;margin:0 auto}
  .en-cal-h{text-align:center;font-size:12px;color:var(--sub);font-weight:600;padding:2px 0}
  .en-cal-cell{aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--txt);border-radius:9px;background:var(--mint-soft);cursor:pointer;position:relative;min-height:34px;transition:transform .08s,background .15s}
  .en-cal-cell.empty{background:transparent;cursor:default}
  .en-cal-cell.today{box-shadow:inset 0 0 0 2px var(--mint)}
  .en-cal-cell.on{background:var(--mint);color:#16222E;font-weight:700}
  .en-cal-cell .ck{position:absolute;right:3px;top:1px;font-size:10px;line-height:1}
  .en-cal-cell:not(.empty):active{transform:scale(.93)}
  /* modal */
  .mask{position:fixed;inset:0;background:rgba(20,40,33,.45);display:none;align-items:center;justify-content:center;z-index:30;padding:20px}
  .mask.open{display:flex;animation:fadeIn .2s}
  .modal{background:#fff;border-radius:18px;padding:22px;max-width:440px;width:100%;max-height:86vh;overflow:auto}
  .modal h3{margin:0 0 14px}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);
    background:var(--green);color:#fff;padding:11px 20px;border-radius:12px;font-weight:600;font-size:14px;
    opacity:0;pointer-events:none;transition:.25s;z-index:50;box-shadow:0 8px 24px rgba(0,0,0,.2)}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .saveflash{animation:flash .6s}
  .today-box{background:linear-gradient(135deg,var(--white),var(--mint-soft));border:1px solid var(--mint-soft)}
  .today-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line)}
  .today-item:last-child{border-bottom:none}
  .today-item.over .txt{color:var(--red);font-weight:700}
  .mini{font-size:12px;color:var(--sub)}
  .monthfold{margin-bottom:10px}
  .monthfold>.hd{display:flex;align-items:center;gap:8px;cursor:pointer;font-weight:700;padding:8px 0}
  .monthfold>.hd svg{width:14px;height:14px;transition:.2s}
  .monthfold.collapsed>.hd svg{transform:rotate(-90deg)}
  .monthfold>.bd{display:block}
  .monthfold.collapsed>.bd{display:none}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @keyframes flash{0%{background:var(--mint)}100%{}}
  /* home hero */
  .home-hero{text-align:center;padding:10px 0 18px}
  .home-hero .greeting{font-size:17px;color:#5a6b63;margin-bottom:8px;font-weight:500}
  .home-hero .greeting b{color:var(--green)}
  .home-hero .clock-wrap{display:flex;align-items:flex-start;justify-content:center;gap:4px;line-height:1}
  .home-hero .clock{font-size:72px;font-weight:200;color:var(--green);letter-spacing:-2px;font-variant-numeric:tabular-nums}
  .home-hero .sec{font-size:26px;font-weight:500;color:var(--mint);margin-top:8px}
  .home-hero .date{font-size:15px;color:var(--sub);margin-top:10px;font-weight:500}
  .quote-card{background:linear-gradient(135deg,var(--white),var(--mint-soft));border:1px solid var(--mint-soft);text-align:center;padding:24px 22px}
  .quote-card .tag{display:inline-block;background:rgba(130,184,162,.16);color:#4a7a68;font-size:12px;font-weight:700;padding:4px 12px;border-radius:20px;margin-bottom:12px}
  .quote-card .cn{font-size:20px;font-weight:700;color:var(--green);margin-bottom:8px;line-height:1.4}
  .quote-card .en{font-size:14px;color:#7d968b;font-style:italic}
  /* quadrant matrix */
  .matrix{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
  .quad{background:#fff;border-radius:16px;border:1px solid var(--line);overflow:hidden;display:flex;flex-direction:column}
  .quad-hd{display:flex;align-items:center;gap:8px;padding:12px 14px;font-weight:700;font-size:14.5px;border-bottom:1px solid var(--line)}
  .quad-hd .dot{width:10px;height:10px;border-radius:50%}
  .quad-hd .add{margin-left:auto;background:transparent;border:none;color:var(--sub);padding:4px;border-radius:6px}
  .quad-hd .add:hover{background:var(--mint-soft);color:var(--green)}
  .quad-hd .add svg{width:18px;height:18px}
  .quad-list{padding:8px 12px;min-height:90px;flex:1}
  .quad-item{display:flex;align-items:flex-start;gap:8px;padding:8px 0;border-bottom:1px dashed var(--line)}
  .quad-item:last-child{border-bottom:none}
  .quad-item.done{opacity:.55}
  .quad-item.done .txt{text-decoration:line-through}
  .quad-item .txt{flex:1;font-size:14px;line-height:1.4;word-break:break-word}
  .quad-item .date{font-size:11px;color:var(--sub);white-space:nowrap}
  .quad-item .del{background:none;border:none;color:var(--sub);padding:2px 4px;border-radius:4px}
  .quad-item .del:hover{background:#F7E4E1;color:var(--red)}
  /* month calendar */
  .cal-hd{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:14px}
  .cal-hd .ym{font-size:20px;font-weight:800;color:var(--green)}
  .cal-hd button{background:var(--mint-soft);border:none;color:var(--green);width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
  .cal-head{text-align:center;font-size:12px;font-weight:700;color:var(--sub);padding:6px 0}
  .cal-cell{min-height:86px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px;display:flex;flex-direction:column;gap:4px}
  .cal-cell.other{opacity:.4;background:#FBFCFD}
  .cal-cell.today{border-color:var(--mint);background:#FBFCFD}
  .cal-cell .dnum{font-size:13px;font-weight:700;color:var(--ink)}
  .cal-cell.today .dnum{color:var(--green)}
  .cal-tag{font-size:11px;line-height:1.25;padding:3px 6px;border-radius:6px;background:var(--mint-soft);color:#1F3A52;display:flex;align-items:center;gap:4px;overflow:hidden;cursor:pointer}
  .cal-tag .cal-tag-t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
  .cal-tag-del{flex:0 0 auto;width:16px;height:16px;line-height:15px;text-align:center;border-radius:50%;background:rgba(190,59,46,.13);color:var(--red);font-weight:700;font-size:13px}
  .cal-tag-del:active{background:rgba(190,59,46,.28)}
  .cal-tag.high{background:#F7E4E1;color:var(--red)}
  .cal-tag.mid{background:#fff3df;color:#d9912b}
  .cal-tag.low{background:var(--mint-soft);color:#1F3A52}
  .cal-tag.done{opacity:.5}
  .cal-tag.done .cal-tag-t{text-decoration:line-through}
  .cal-add-day{font-size:11px;color:var(--mint);margin-top:auto;align-self:flex-end;cursor:pointer;padding:2px 4px;border-radius:4px}
  .cal-add-day:hover{background:var(--mint-soft)}
  .cal-lunar{font-size:10px;line-height:1.2;color:#9aa6a0;margin-top:1px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cal-lunar.fest{color:var(--red);font-weight:600}
  .quad-item.dragging{opacity:.4}
  .quad-list.dragover{background:rgba(130,184,162,.14);border-radius:10px}
  /* water */
  .water-q{flex:1;min-width:80px;background:var(--mint-soft);color:var(--green);border:none;border-radius:12px;padding:12px;font-weight:700}
  .water-q:hover{background:var(--mint);color:#fff}
  .water-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line)}
  .water-row:last-child{border-bottom:none}
  .water-row .drop{width:10px;height:10px;border-radius:50%;background:var(--mint)}
  .water-row .amt{flex:1;font-weight:700;color:var(--green)}
  .water-row .time{color:var(--sub);font-size:12px}
  /* countdown */
  .cd-item{display:flex;align-items:center;gap:12px;padding:12px;background:#FBFCFD;border-radius:14px;margin-bottom:10px}
  .cd-item .cd-icon{width:40px;height:40px;border-radius:12px;background:#fff;display:flex;align-items:center;justify-content:center;color:var(--mint)}
  .cd-item .cd-icon svg{width:22px;height:22px}
  .cd-item .cd-body{flex:1;min-width:0}
  .cd-item .cd-title{font-weight:700;color:var(--ink);font-size:15px}
  .cd-item .cd-date{font-size:12px;color:var(--sub);margin-top:2px}
  .cd-item .cd-num{font-size:32px;font-weight:800;color:var(--green);line-height:1}
  .cd-item .cd-num span{font-size:14px;color:var(--sub);font-weight:600;margin-left:2px}
  .cd-item .del{background:none;border:none;color:var(--sub);padding:4px 8px;border-radius:6px}
  .cd-item .del:hover{background:#F7E4E1;color:var(--red)}
  /* memo */
  .memo-desc{color:var(--sub);font-size:13px;margin-bottom:12px}
  .memo-item{background:#FBFCFD;border-radius:14px;padding:14px;margin-bottom:10px}
  .memo-item .memo-hd{display:flex;align-items:center;gap:10px;margin-bottom:8px}
  .memo-item .memo-title{font-weight:700;flex:1}
  .memo-item .memo-date{font-size:12px;color:var(--sub)}
  .memo-item .del{background:none;border:none;color:var(--sub);padding:2px 6px;border-radius:6px}
  .memo-item .del:hover{background:#F7E4E1;color:var(--red)}
  .memo-item .memo-body{font-size:14px;color:#4a5c55;line-height:1.6;white-space:pre-wrap}
  /* finance dashboard */
  .fin-header{background:linear-gradient(135deg,#FBFCFD,#E4ECF2)}
  .fin-month{font-size:22px;font-weight:800;color:var(--green)}
  .fin-tag{padding:8px 14px;border-radius:20px;font-size:13px;font-weight:700;background:#fff;border:1px solid var(--line)}
  .fin-tag.in{color:var(--green-up);border-color:#E8F0F6}
  .fin-tag.out{color:var(--red);border-color:#f9d9d6}
  .fin-days{display:flex;gap:6px;overflow-x:auto;padding:4px 0}
  .fin-day{flex:0 0 40px;height:44px;border-radius:12px;border:1px solid var(--line);background:#fff;font-size:13px;font-weight:700;color:var(--ink);cursor:pointer}
  .fin-day.sel{background:var(--green);color:#fff;border-color:var(--green)}
  .fin-day.today{border-color:var(--mint);color:var(--green)}
  .fin-cates{display:flex;flex-direction:column;gap:8px}
  .fin-cate{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:#fff;font-size:14px;font-weight:600;color:var(--ink);cursor:pointer;transition:transform .08s,background .15s,border-color .15s;text-align:left}
  .fin-cate:active{transform:scale(.99)}
  .fin-cate.sel{background:var(--mint-soft);border-color:var(--mint);color:var(--green)}
  .fin-cate .cate-ico{flex:0 0 auto;width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;color:#fff;line-height:1;box-shadow:0 2px 6px rgba(0,0,0,.1)}
  .fin-cate .cate-name{flex:1;font-size:15px;font-weight:600}
  .fin-cate .cate-amt{font-size:14px;font-weight:700}
  .fin-cate .cate-arr{font-size:20px;color:var(--sub);line-height:1}
  /* finance month overview */
  .fin-overview{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}
  .fin-sum-card{background:#fff;border:1px solid #f0e6dc;border-radius:16px;padding:18px 10px;text-align:center;box-shadow:var(--shadow)}
  .fin-sum-val{font-size:24px;font-weight:800;line-height:1.1}
  .fin-sum-lab{font-size:13px;color:var(--sub);margin-top:6px}
  .fin-row{display:flex;align-items:center;gap:10px;padding:12px;background:#FBFCFD;border-radius:14px;margin-top:10px}
  .fin-row:first-child{margin-top:0}
  .fin-label{font-size:15px;color:var(--sub);white-space:nowrap;min-width:80px}
  .fin-input{flex:1;border:1px solid var(--line);border-radius:12px;padding:11px 14px;font-size:16px;background:#fff}
  .fin-add{border-radius:999px;padding:10px 24px;font-size:15px}
  /* early checkin */
  .early-cal{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-top:14px}
  .early-cal-head{text-align:center;font-size:12px;color:var(--sub);padding:6px 0}
  .early-cal-cell{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:12px;background:#E4ECF2;font-size:14px;cursor:pointer;transition:transform .08s,background .15s}
  .early-cal-cell.empty{background:transparent;cursor:default}
  .early-cal-cell.today{box-shadow:0 0 0 2px var(--mint)}
  .early-cal-cell.on{background:var(--mint-soft);color:var(--green);font-weight:700}
  .early-cal-cell:not(.empty):active{transform:scale(.94)}
  .early-cal-cell .time{font-size:11px;margin-top:2px}
  .early-week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-top:14px}
  .early-day{aspect-ratio:.8;border-radius:12px;background:#E4ECF2;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:13px;cursor:pointer;transition:transform .08s,background .15s}
  .early-day.on{background:var(--mint-soft);color:var(--green);font-weight:700}
  .early-day:active{transform:scale(.94)}
  .early-year{display:grid;gap:10px;margin-top:14px}
  .early-month{display:flex;align-items:center;gap:10px}
  .early-month .m{width:40px;font-size:14px;color:var(--sub)}
  .early-month .bar{flex:1;height:10px;background:var(--tint);border-radius:999px;overflow:hidden}
  .early-month .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--mint),var(--green));border-radius:999px}
  .early-month .pct{width:40px;text-align:right;font-size:13px;font-weight:700;color:var(--green)}
  /* exercise year table */
  .ext-table{display:grid;gap:4px}
  .ext-row{display:grid;grid-template-columns:50px repeat(4,1fr);gap:4px;align-items:center}
  .ext-row.head{font-weight:700;color:var(--sub);font-size:13px}
  .ext-row span{text-align:center;padding:8px 4px;border-radius:8px;background:#E4ECF2;font-size:13px}
  .ext-row span.on{background:var(--mint-soft);color:var(--green);font-weight:700}
  .ext-row .m{font-weight:700;color:var(--ink)}
  .section-title .add-btn{margin-left:auto;background:var(--mint-soft);border:none;color:var(--green);width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;padding:0}
  .section-title .add-btn:hover{background:var(--mint);color:#fff}
  .section-title .add-btn svg{width:18px;height:18px}
  .rec-types{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
  .rec-stat{cursor:pointer;text-align:center;transition:transform .1s}
  .rec-stat:active{transform:scale(.96)}
  .rec-thumb{width:56px;height:56px;border-radius:10px;overflow:hidden;background:var(--mint-soft);margin-right:12px;flex:0 0 56px}
  .rec-thumb img{width:100%;height:100%;object-fit:cover}
  .rec-thumb-empty{width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:var(--sub);font-size:12px}
  .rec-wall{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  .rec-card{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 2px 8px rgba(46,71,62,.06);transition:transform .15s}
  .rec-card:hover{transform:translateY(-3px)}
  .rec-card .cover{aspect-ratio:3/4;background:var(--mint-soft);position:relative;overflow:hidden}
  .rec-card .cover img{width:100%;height:100%;object-fit:cover}
  .rec-card .cover .empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--sub);font-size:13px}
  .rec-card .info{padding:12px}
  .rec-card .name{font-weight:700;font-size:15px;margin-bottom:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .rec-card .meta{font-size:12px;color:var(--sub);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .rec-form{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;align-items:flex-end}
  .rec-form .imgbox{grid-column:1/-1}
  @media (max-width:768px){
    .rec-types{grid-template-columns:repeat(3,1fr)}
    .rec-wall{grid-template-columns:repeat(2,1fr)}
    .rec-form{grid-template-columns:1fr}
  }
  @media (max-width:768px){
    .matrix{grid-template-columns:1fr}
    .cal-cell{min-height:72px;padding:4px}
    .cal-tag{font-size:10px;padding:2px 4px}
    .cal-cell .dnum{font-size:12px}
    .fin-overview{grid-template-columns:repeat(3,1fr);gap:8px}
    .fin-sum-card{padding:14px 6px}
    .fin-sum-val{font-size:18px}
    .fin-sum-lab{font-size:12px}
    .fin-label{min-width:70px;font-size:14px}
    .fin-add{padding:9px 16px;font-size:14px}
    .fin-cate{padding:11px 12px;gap:10px}
    .fin-cate .cate-ico{width:36px;height:36px;font-size:15px}
    .fin-cate .cate-name{font-size:14px}
    .fin-cate .cate-amt{font-size:13px}
    .early-cal{gap:4px}
    .early-cal-cell{font-size:12px;border-radius:8px}
    .ext-row span{padding:6px 2px;font-size:12px}
  }
  /* mobile */
  .bottomnav{display:none}
  @media (max-width:768px){
    .sidebar{position:fixed;left:0;top:0;z-index:40;transform:translateX(-100%);transition:.25s;box-shadow:0 0 40px rgba(0,0,0,.3)}
    .sidebar.open{transform:translateX(0)}
    .hamburger{display:flex}
    .main{width:100%}
    header.top{padding:12px 14px}
    header.top h1{font-size:16px}
    .content{padding:14px}
    .g2,.g3,.g4{grid-template-columns:1fr}
    .topbtns .btn span{display:none}
    .badges{width:100%;margin-left:0;order:3}
    .bottomnav{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);
      justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:20}
    .bottomnav button{flex:1;background:none;border:none;color:var(--sub);font-size:10.5px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px}
    .bottomnav button svg{width:21px;height:21px}
    .bottomnav button.active{color:var(--green)}
    .content{padding-bottom:80px}
    .scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:35}
    .scrim.open{display:block}
  }

        if(isLeap){

            isLeap = false;

        }else{ 

            isLeap = true; --i;

        }

        if(offset<0){ offset += temp; --i; }

        //农历月

        var month   = i;

        //农历日

        var day     = offset + 1;

        

        //天干地支处理

        var sm      =   m-1;

        var gzY     =   calendar.toGanZhiYear(year);

        

        //月柱 1900年1月小寒以前为 丙子月(60进制12)

        var firstNode   = calendar.getTerm(year,(m*2-1));//返回当月「节」为几日开始

        var secondNode  = calendar.getTerm(year,(m*2));//返回当月「节」为几日开始

        

        //依据12节气修正干支月

        var gzM     =   calendar.toGanZhi((y-1900)*12+m+11);

        if(d>=firstNode) {

            gzM     =   calendar.toGanZhi((y-1900)*12+m+12);

        }

        

        //传入的日期的节气与否

        var isTerm = false;

        var Term   = null;

        if(firstNode==d) {

            isTerm  = true;

            Term    = calendar.solarTerm[m*2-2];

        }

        if(secondNode==d) {

            isTerm  = true;

            Term    = calendar.solarTerm[m*2-1];

        }

        //日柱 当月一日与 1900/1/1 相差天数

        var dayCyclical = Date.UTC(y,sm,1,0,0,0,0)/86400000+25567+10;

        var gzD = calendar.toGanZhi(dayCyclical+d-1);

        //该日期所属的星座

        var astro = calendar.toAstro(m,d);

        

        return {'lYear':year,'lMonth':month,'lDay':day,'Animal':calendar.getAnimal(year),'IMonthCn':(isLeap?"\u95f0":'')+calendar.toChinaMonth(month),'IDayCn':calendar.toChinaDay(day),'cYear':y,'cMonth':m,'cDay':d,'gzYear':gzY,'gzMonth':gzM,'gzDay':gzD,'isToday':isToday,'isLeap':isLeap,'nWeek':nWeek,'ncWeek':"\u661f\u671f"+cWeek,'isTerm':isTerm,'Term':Term,'astro':astro};

    },



    /**

      * 传入农历年月日以及传入的月份是否闰月获得详细的公历、农历object信息 <=>JSON

      * @param y  lunar year

      * @param m  lunar month

      * @param d  lunar day

      * @param isLeapMonth  lunar month is leap or not.[如果是农历闰月第四个参数赋值true即可]

      * @return JSON object

      * @eg:console.log(calendar.lunar2solar(1987,9,10));

      */

    lunar2solar:function(y,m,d,isLeapMonth) {   //参数区间1900.1.31~2100.12.1

        var isLeapMonth = !!isLeapMonth;

        var leapOffset  = 0;

        var leapMonth   = calendar.leapMonth(y);

        var leapDay     = calendar.leapDays(y);

        if(isLeapMonth&&(leapMonth!=m)) {return -1;}//传参要求计算该闰月公历 但该年得出的闰月与传参的月份并不同

        if(y==2100&&m==12&&d>1 || y==1900&&m==1&&d<31) {return -1;}//超出了最大极限值 

        var day  = calendar.monthDays(y,m); 

        var _day = day;

        //bugFix 2016-9-25 

        //if month is leap, _day use leapDays method 

        if(isLeapMonth) {

            _day = calendar.leapDays(y,m);

        }

        if(y < 1900 || y > 2100 || d > _day) {return -1;}//参数合法性效验

        

        //计算农历的时间差

        var offset = 0;

        for(var i=1900;i<y;i++) {

            offset+=calendar.lYearDays(i);

        }

        var leap = 0,isAdd= false;

        for(var i=1;i<m;i++) {

            leap = calendar.leapMonth(y);

            if(!isAdd) {//处理闰月

                if(leap<=i && leap>0) {

                    offset+=calendar.leapDays(y);isAdd = true;

                }

            }

            offset+=calendar.monthDays(y,i);

        }

        //转换闰月农历 需补充该年闰月的前一个月的时差

        if(isLeapMonth) {offset+=day;}

        //1900年农历正月一日的公历时间为1900年1月30日0时0分0秒(该时间也是本农历的最开始起始点)

        var stmap   =   Date.UTC(1900,1,30,0,0,0);

        var calObj  =   new Date((offset+d-31)*86400000+stmap);

        var cY      =   calObj.getUTCFullYear();

        var cM      =   calObj.getUTCMonth()+1;

        var cD      =   calObj.getUTCDate();



        return calendar.solar2lunar(cY,cM,cD);

    }

};

function loadDB(){
  let raw=null; try{raw=localStorage.getItem(DB_KEY);}catch(e){}
  if(raw){ try{db=JSON.parse(raw);}catch(e){db=freshDB();} }
  if(!db||!db.modules){ db=freshDB(); seedExamples(db); saveDB(true); }
  if(!db.custom) db.custom={};
  if(!db.meta) db.meta={created:Date.now()};
  // ensure new arrays exist for upgraded data
  if(!db.checkin) db.checkin={};
  if(!db.checkin.water) db.checkin.water=[];
  if(!db.checkin.english || Array.isArray(db.checkin.english)) db.checkin.english={reading:Array.isArray(db.checkin.english)?db.checkin.english:[],listening:[],writing:[],speaking:[]};
  if(!db.checkin.exercise || Array.isArray(db.checkin.exercise)) db.checkin.exercise={shoulder:Array.isArray(db.checkin.exercise)?db.checkin.exercise:[],leg:[],abdomen:[],arm:[]};
  if(!db.countdowns) db.countdowns=[];
  if(!db.memo) db.memo=[];
  // 升级安全：把默认模块里新增的子模块（如喝水打卡）补全到老用户的模块结构
  defaultModules().forEach(dm=>{
    const m=db.modules.find(x=>x.id===dm.id);
    if(m && dm.subs){
      dm.subs.forEach(ds=>{ if(!m.subs.some(s=>s.id===ds.id)) m.subs.push(ds); });
    }
  });
  // 清理已从默认模块中移除的子模块（如阅读打卡、象棋打卡）
  const removedSubs={'checkin':['reading','chess'], 'records':['video']};
  db.modules.forEach(m=>{
    const rm=removedSubs[m.id];
    if(rm) m.subs=m.subs.filter(s=>!rm.includes(s.id));
  });
  if(db.checkin.chess) delete db.checkin.chess;
  if(db.records && db.records.video) delete db.records.video;
  // 清理已从默认模块中移除的一级模块（如工作、英语学习），并删除其残留数据
  const removedModules=['work','english'];
  db.modules=db.modules.filter(m=>!removedModules.includes(m.id));
  removedModules.forEach(id=>{ if(db[id]) delete db[id]; });
  // 财务模块子模块升级：老用户的 bills/budgets/savings/assets 入口统一为 expense/income，历史数据保留
  const fin=db.modules.find(m=>m.id==='finance');
  if(fin){
    const hasNew=fin.subs.some(s=>s.id==='expense'||s.id==='income');
    if(!hasNew) fin.subs=[{id:'expense',name:'支出'},{id:'income',name:'收入'}];
    else fin.subs=fin.subs.filter(s=>!['bills','budgets','savings','assets'].includes(s.id));
  }
  // migrate early from string[] to object[]
  if(Array.isArray(db.checkin.early) && db.checkin.early.length>0 && typeof db.checkin.early[0]==='string'){
    db.checkin.early=db.checkin.early.map(date=>({id:uid(),date,time:''}));
  }
  // migrate plan items to quadrant model
  ['daily','weekly'].forEach(k=>{ if(db.plan && db.plan[k]) db.plan[k].forEach(x=>{ if(!x.quadrant){ x.quadrant = x.prio==='high'?'iu':x.prio==='mid'?'inu':'ninu'; } }); });
  // migrate records.photo -> records.video (影视记录)
  if(db.records && db.records.photo){ delete db.records.photo; }
  // 用户指定写入的阅读笔记：一次性合并进 db.reading.notes（按摘录去重，仅执行一次）
  if(!db._seededNotes){
    if(!db.reading) db.reading={books:[],notes:[]};
    if(!db.reading.notes) db.reading.notes=[];
    const _ex=new Set(db.reading.notes.map(n=>(n&&n.quote||'').trim()));
    SEED_READING_NOTES.forEach(q=>{ const t=(q||'').trim(); if(t && !_ex.has(t)){ db.reading.notes.push({id:uid(),book:'',page:'',quote:t,thought:''}); _ex.add(t);} });
    db._seededNotes=true; saveDB(true);
  }
}

function doRename(key){

  else { m=db.modules.find(x=>x.id===key); oldName=m?m.name:''; }
  if(!m) return;
  const nn=prompt('重命名栏目：', oldName);
  if(nn===null) return;

/* 左侧导航拖拽排序（指针事件，桌面+触屏通用） */
let navDrag=null;
function initNavDrag(){
  const nav=document.getElementById('nav'); if(!nav || nav._dragBound) return; nav._dragBound=true;
  nav.addEventListener('pointerdown', e=>{
    const grip=e.target.closest('[data-drag]'); if(!grip) return;
    e.preventDefault();
    const group=grip.closest('.navgroup');
    navDrag={group, moved:false, pid:e.pointerId};
    group.classList.add('dragging');
    try{ grip.setPointerCapture(e.pointerId); }catch(_){}
    grip.addEventListener('pointermove', onNavDragMove);
    grip.addEventListener('pointerup', onNavDragEnd);
    grip.addEventListener('pointercancel', onNavDragEnd);
  });
}
function onNavDragMove(e){
  if(!navDrag) return; navDrag.moved=true;
  const nav=document.getElementById('nav');
  const groups=[...nav.querySelectorAll('.navgroup')].filter(g=>g!==navDrag.group);
  let target=null;
  for(const g of groups){ const r=g.getBoundingClientRect(); if(e.clientY < r.top + r.height/2){ target=g; break; } }
  if(target) nav.insertBefore(navDrag.group, target); else nav.appendChild(navDrag.group);
}
function onNavDragEnd(e){
  if(!navDrag) return;
  const grip=e.target;
  grip.removeEventListener('pointermove', onNavDragMove);
  grip.removeEventListener('pointerup', onNavDragEnd);
  grip.removeEventListener('pointercancel', onNavDragEnd);
  navDrag.group.classList.remove('dragging');
  const nav=document.getElementById('nav');
  const order=[...nav.querySelectorAll('.navgroup')].map(g=>g.dataset.navid);
  db.modules.sort((a,b)=>order.indexOf(a.id)-order.indexOf(b.id));
  const moved=navDrag.moved; navDrag=null; saveDB();
  if(moved) toast('顺序已保存');
}

const SOLAR_FEST={'1-1':'元旦','2-14':'情人节','3-8':'妇女节','3-12':'植树节','5-1':'劳动节','5-4':'青年节','6-1':'儿童节','7-1':'建党节','8-1':'建军节','9-10':'教师节','10-1':'国庆','12-25':'圣诞'};
function getFestival(c){ const sf=SOLAR_FEST[c.cMonth+'-'+c.cDay]; if(sf) return sf; const lf=LUNAR_FEST[c.lMonth+'-'+c.lDay]; if(lf) return lf; return ''; }
function renderCalendar(y,m){
  const first=new Date(y,m,1).getDay();
  const days=new Date(y,m+1,0).getDate();
  const prevDays=new Date(y,m,0).getDate();
  const head=['日','一','二','三','四','五','六'].map(d=>'<div class="cal-head">'+d+'</div>').join('');
  let cells='';
  for(let i=first-1;i>=0;i--){ cells+='<div class="cal-cell other"><span class="dnum">'+(prevDays-i)+'</span></div>'; }
  const t=todayISO();
  for(let d=1;d<=days;d++){
    const iso=y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    const items=db.plan.monthly.filter(x=>{
      if(!x.due) return false;
      if(iso>x.due) return false;
      if(x.sdate) return iso>=x.sdate;
      return iso===x.due;
    });
    const isToday=iso===t;
    const lun=lunarText(y,m,d);
    cells+='<div class="cal-cell'+(isToday?' today':'')+'">'+
      '<span class="dnum">'+d+'</span>'+
      '<span class="cal-lunar'+(lun.fest?' fest':'')+'">'+esc(lun.text)+'</span>'+
      items.map(x=>{
        const anchor=x.sdate?iso===x.sdate:iso===x.due;
        const del=anchor?'<span class="cal-tag-del" data-delplan="'+x.id+'" data-sub="monthly" title="删除计划">×</span>':'';
        return '<div class="cal-tag'+(x.prio==='high'?' high':x.prio==='mid'?' mid':' low')+(x.done?' done':'')+'" data-planchk="'+x.id+'" data-sub="monthly" title="'+esc(x.title)+'"><span class="cal-tag-t">'+esc(x.title)+'</span>'+del+'</div>';
      }).join('')+
      '<span class="cal-add-day" data-calday="'+iso+'">+</span>'+
    '</div>';
  }
  const total=first+days;
  const next=total%7===0?0:7-total%7;
  for(let d=1;d<=next;d++){ cells+='<div class="cal-cell other"><span class="dnum">'+d+'</span></div>'; }
  return '<div class="cal-grid">'+head+cells+'</div>';
}
function lunarText(y,m,d){
  try{ const c=calendar.solar2lunar(y,m+1,d); if(c&&c.Term) return {text:c.Term,fest:false}; const fest=getFestival(c); if(fest) return {text:fest,fest:true}; return {text:c?c.IDayCn:'',fest:false}; }
  catch(e){ return {text:'',fest:false}; }
}

/* ============ 早起打卡 ============ */
function timeToMin(t){if(!t)return null;const [h,m]=t.split(':');return Number(h||0)*60+Number(m||0);}
function minToTime(m){const h=Math.floor(m/60);const mn=m%60;return String(h).padStart(2,'0')+':'+String(mn).padStart(2,'0');}
function avgTime(recs){
  const mins=recs.map(x=>timeToMin(typeof x==='string'?'':x.time)).filter(v=>v!=null);
  if(!mins.length)return'--:--';
  const avg=Math.round(mins.reduce((a,b)=>a+b,0)/mins.length);
  return minToTime(avg);
}
function maxConsecutive(dates){
  const list=[...new Set(dates.filter(Boolean))].sort();
  if(!list.length)return 0;
  let max=1,cur=1;
  for(let i=1;i<list.length;i++){
    const a=new Date(list[i-1]), b=new Date(list[i]);
    const diff=Math.round((b-a)/864e5);
    if(diff===1)cur++; else cur=1;
    if(cur>max)max=cur;
  }
  return max;
}
function monthDays(y,m){return new Date(y,m+1,0).getDate();}
function earlyDate(x){return typeof x==='string'?x:(x&&x.date?x.date:'');}
function earlyTime(x){return typeof x==='string'?'':(x&&x.time?x.time:'');}

/* ============ 英语打卡 ============ */
function renderEnglishCheckin(){
  const items=[{k:'reading',name:'阅读'},{k:'listening',name:'听力'},{k:'writing',name:'写作'},{k:'speaking',name:'口语'}];
  const cur=state.enItem&&items.some(it=>it.k===state.enItem)?state.enItem:'reading';
  const t=todayISO();
  const pills=items.map(it=>'<button class="tab'+(cur===it.k?' active':'')+'" data-enitem="'+it.k+'">'+it.name+'</button>').join('');
  const doneToday=db.checkin.english[cur].includes(t);
  const quick='<button class="btn '+(doneToday?'':'primary')+'" data-encheck="'+cur+'" '+(doneToday?'disabled':'')+'" style="flex:1;min-height:48px">'+items.find(i=>i.k===cur).name+' · 今日打卡</button>';
  const ym=state.enMonth||new Date(); const yr=ym.getFullYear(), mo=ym.getMonth();
  const arr=db.checkin.english[cur];
  const first=new Date(yr,mo,1).getDay(); const dim=monthDays(yr,mo);
  const labels=['日','一','二','三','四','五','六'];
  let grid='<div class="en-cal">';
  labels.forEach(l=>grid+='<div class="en-cal-h">'+l+'</div>');
  for(let i=0;i<first;i++) grid+='<div class="en-cal-cell empty"></div>';
  for(let d=1;d<=dim;d++){
    const iso=yr+'-'+String(mo+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    const on=arr.includes(iso); const isT=iso===t;
    grid+='<div class="en-cal-cell'+(on?' on':'')+(isT?' today':'')+'" data-entoggle="'+cur+'|'+iso+'">'+d+(on?'<span class="ck">✓</span>':'')+'</div>';
  }
  const enTotal=first+dim; const enNext=enTotal%7===0?0:7-enTotal%7;
  for(let d=1;d<=enNext;d++) grid+='<div class="en-cal-cell empty"></div>';
  grid+='</div>';
  const nav='<div class="row" style="align-items:center;margin-bottom:10px"><button class="btn sm" data-enprev>‹</button><span style="flex:1;text-align:center;font-weight:600">'+yr+'年'+(mo+1)+'月</span><button class="btn sm" data-ennext>›</button></div>';
  const chart=checkinMonthBars('english',items,12);
  return '<div class="card"><div class="section-title">英语打卡</div>'+
    '<div class="row" style="flex-wrap:wrap;gap:6px;margin-bottom:10px">'+pills+'</div>'+
    '<div style="margin-bottom:12px">'+quick+'</div>'+
    nav+grid+'</div>'+
    '<div class="card"><div class="section-title">本月统计</div>'+chart+'</div>'+
    '<div class="card"><div class="section-title">年度统计</div>'+englishYearChart()+englishYearTable()+'</div>';
}

function englishYearChart(){
  const y=new Date().getFullYear();
  const items=[{k:'reading',name:'阅读'},{k:'listening',name:'听力'},{k:'writing',name:'写作'},{k:'speaking',name:'口语'}];
  const maxH=120; let maxV=1; const data=[];
  for(let i=1;i<=12;i++){ const ym=y+'-'+String(i).padStart(2,'0'); let tot=0; items.forEach(it=>{tot+=db.checkin.english[it.k].filter(d=>d.slice(0,7)===ym).length;}); data.push(tot); if(tot>maxV)maxV=tot; }
  const bars=data.map((tot,i)=>yearBar(Math.max(6,Math.round(tot/maxV*maxH)),(i+1)+'月',tot+'天'));
  return '<div style="display:flex;align-items:flex-end;gap:4px;padding:8px 0">'+bars.join('')+'</div>';
}
function englishYearTable(){
  const y=new Date().getFullYear();
  const items=[{k:'reading',name:'阅读'},{k:'listening',name:'听力'},{k:'writing',name:'写作'},{k:'speaking',name:'口语'}];
  const head='<div class="ext-row head" style="grid-template-columns:54px repeat(5,1fr)"><span class="m">月份</span>'+items.map(it=>'<span>'+it.name+'</span>').join('')+'<span>合计</span></div>';
  const rows=[];
  for(let i=1;i<=12;i++){
    const ym=y+'-'+String(i).padStart(2,'0');
    let tot=0;
    const cells=items.map(it=>{ const c=db.checkin.english[it.k].filter(d=>d.slice(0,7)===ym).length; tot+=c; return '<span class="'+(c>0?'on':'')+'">'+(c||'-')+'</span>'; }).join('');
    rows.push('<div class="ext-row" style="grid-template-columns:54px repeat(5,1fr)"><span class="m">'+i+'月</span>'+cells+'<span class="on">'+tot+'</span></div>');
  }
  return '<div class="ext-table">'+head+rows.join('')+'</div>';
}

/* ============ 锻炼打卡 ============ */

  const t=todayISO();
  const items=[{k:'shoulder',name:'肩颈'},{k:'leg',name:'腿部'},{k:'abdomen',name:'腹部'},{k:'arm',name:'手臂'}];
  const btns=items.map(it=>{
    const done=db.checkin.exercise[it.k].includes(t);
    return '<button class="btn '+(done?'':'primary')+'" data-excheck="'+it.k+'" '+(done?'disabled':'')+' style="flex:1;min-width:90px;min-height:60px">'+(done?'已打卡':it.name)+'</button>';

function checkinMonthBars(top,items,maxH){
  const y=new Date().getFullYear(), m=new Date().getMonth();
  const dim=monthDays(y,m);
  const ym=todayISO().slice(0,7);
  const bars=items.map(it=>{
    const cnt=db.checkin[top][it.k].filter(d=>d.slice(0,7)===ym).length;
    const h=Math.max(6,Math.round(cnt/dim*maxH));
    return '<div style="flex:1;text-align:center"><div style="height:'+maxH+'px;display:flex;align-items:flex-end;justify-content:center"><div style="width:26px;height:'+h+'px;background:linear-gradient(180deg,var(--mint),var(--green));border-radius:6px 6px 0 0"></div></div><div class="mini" style="margin-top:4px">'+it.name+'</div><div style="font-size:12px;font-weight:700">'+cnt+'天</div></div>';
  });
  return '<div style="display:flex;align-items:flex-end;gap:8px;padding:8px 0">'+bars.join('')+'</div>';
}
function exerciseYearTable(items){
  const y=new Date().getFullYear();
  const head='<div class="ext-row head"><span class="m">月份</span>'+items.map(it=>'<span>'+it.name+'</span>').join('')+'</div>';
  const rows=[];
  for(let i=1;i<=12;i++){
    const ym=y+'-'+String(i).padStart(2,'0');
    const cells=items.map(it=>{
      const cnt=db.checkin.exercise[it.k].filter(d=>d.slice(0,7)===ym).length;
      return '<span class="'+(cnt>0?'on':'')+'">'+(cnt||'-')+'</span>';
    }).join('');
    rows.push('<div class="ext-row"><span class="m">'+i+'月</span>'+cells+'</div>');
  }
  return '<div class="ext-table">'+head+rows.join('')+'</div>';
}

/* ============ 喝水打卡 ============ */
function renderWater(){
  const t=todayISO();
  const goal=db.custom&&db.custom.waterGoal?db.custom.waterGoal:1500;
  const todayRecs=db.checkin.water.filter(x=>x.date===t).sort((a,b)=>a.time.localeCompare(b.time));
  const todayAmount=todayRecs.reduce((s,x)=>s+x.amount,0);
  const remain=Math.max(0,goal-todayAmount);
  const pct=goal>0?Math.min(100,Math.round(todayAmount/goal*100)):0;
  const ring=waterRing(pct,todayAmount,goal);
  const quick=[200,300,500].map(n=>'<button class="btn water-q" data-wateradd="'+n+'">'+n+'ml</button>').join('');
  const list=todayRecs.map(x=>'<div class="water-row"><span class="drop"></span><span class="amt">'+x.amount+'ml</span><span class="time">'+esc(x.time)+'</span><button class="btn sm danger" data-delwater="'+x.id+'">删除</button></div>').join('');
  const chart=waterBarChart();
  return '<div class="card"><div class="row" style="align-items:flex-start;gap:18px">'+
    '<div style="flex:1">'+ring+'</div>'+
    '<div style="flex:1.2;min-width:180px;display:flex;flex-direction:column;gap:8px">'+
      '<div style="font-size:18px;font-weight:700;color:var(--green)">喝水打卡</div>'+
      '<div style="font-size:15px">已喝 <b>'+todayAmount+'</b> / '+goal+' ml</div>'+
      '<div style="font-size:14px;color:var(--sub)">还需喝 '+remain+' ml</div>'+
      '<div style="font-size:13px;color:var(--sub)">目标：<input data-watergoal type="number" value="'+goal+'" style="width:80px;padding:4px 8px;border:1px solid var(--line);border-radius:8px"> ml <button class="btn sm" data-savegoal>保存</button></div>'+
    '</div></div></div>'+
    '<div class="card"><div class="section-title">快捷记录</div><div class="row" style="align-items:center">'+quick+
      '<label class="fld" style="flex:0 0 120px"><span>自定义 ml</span><input data-watercustom type="number" min="1"></label>'+
      '<button class="btn primary" data-wateradd="custom">添加</button>'+
    '</div></div>'+
    '<div class="card"><div class="section-title">今日记录</div>'+(list||'<div class="empty">还没有喝水记录</div>')+'</div>'+
    '<div class="card"><div class="section-title">最近7天趋势</div>'+chart+'</div>'+
    '<div class="card"><div class="section-title">年度喝水趋势</div>'+waterYearChart()+'</div>';
}
function waterRing(pct,todayAmount,goal){
  const r=70,c=80,stroke=14,circ=2*Math.PI*r;
  const off=circ*(1-pct/100);
  return '<svg viewBox="0 0 160 160" width="160" height="160" style="display:block;margin:0 auto">'+
    '<circle cx="'+c+'" cy="'+c+'" r="'+r+'" fill="none" stroke="#E8F0F6" stroke-width="'+stroke+'"/>'+
    '<circle cx="'+c+'" cy="'+c+'" r="'+r+'" fill="none" stroke="var(--mint)" stroke-width="'+stroke+'" stroke-linecap="round" transform="rotate(-90 '+c+' '+c+')" stroke-dasharray="'+circ+'" stroke-dashoffset="'+off+'" style="transition:.4s"/>'+
    '<text x="'+c+'" y="'+c+'" text-anchor="middle" dominant-baseline="middle" font-size="28" font-weight="800" fill="var(--green)">'+pct+'%</text>'+
    '<text x="'+c+'" y="'+(c+26)+'" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="var(--sub)">'+todayAmount+'ml</text>'+
  '</svg>';
}
function waterBarChart(){
  const days=[];
  for(let i=6;i>=0;i--){ const d=new Date(); d.setDate(d.getDate()-i); days.push(d.toISOString().slice(0,10)); }
  const goal=db.custom&&db.custom.waterGoal?db.custom.waterGoal:1500;
  const max=Math.max(goal,...days.map(d=>db.checkin.water.filter(x=>x.date===d).reduce((s,x)=>s+x.amount,0)));
  const bars=days.map((d,i)=>{
    const amt=db.checkin.water.filter(x=>x.date===d).reduce((s,x)=>s+x.amount,0);
    const h=max>0?Math.max(6,Math.round(amt/max*90)):6;
    const label=i===6?'今天':d.slice(5);
    return '<div style="flex:1;text-align:center"><div style="height:100px;display:flex;align-items:flex-end;justify-content:center"><div style="width:22px;height:'+h+'px;background:linear-gradient(180deg,var(--mint),var(--green));border-radius:6px 6px 0 0"></div></div><div class="mini" style="margin-top:4px">'+label+'</div></div>';
  }).join('');
  return '<div style="display:flex;gap:6px;align-items:flex-end;padding:8px 0">'+bars+'</div>';
}
function waterYearChart(){
  const y=new Date().getFullYear();
  const goal=db.custom&&db.custom.waterGoal?db.custom.waterGoal:1500;
  const maxH=120; const data=[];
  for(let i=1;i<=12;i++){ const ym=y+'-'+String(i).padStart(2,'0'); const amt=db.checkin.water.filter(x=>x.date.slice(0,7)===ym).reduce((s,x)=>s+x.amount,0); data.push(amt); }
  const maxV=Math.max(goal,...data,1);
  const bars=data.map((amt,i)=>yearBar(Math.max(6,Math.round(amt/maxV*maxH)),(i+1)+'月',amt>=1000?Math.round(amt/100)/10+'L':amt+'ml'));
  return '<div style="display:flex;align-items:flex-end;gap:4px;padding:8px 0">'+bars.join('')+'</div>';
}

function lineChart(vals,labels){
  const W=520,H=180,pad=30; const max=Math.max(...vals,100),min=0;
  const n=vals.length; const step=n>1?(W-pad*2)/(n-1):0;
  const pts=vals.map((v,i)=>[pad+i*step, H-pad-((v-min)/(max-min))*(H-pad*2)]);
  let path='M'+pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' L');
  let dots=pts.map((p,i)=>'<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="4" fill="#1F3A52"/><text x="'+p[0].toFixed(1)+'" y="'+(p[1]-8).toFixed(1)+'" font-size="10" fill="#788794" text-anchor="middle">'+esc(vals[i])+'</text>').join('');
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" style="max-width:'+W+'px"><line x1="'+pad+'" y1="'+(H-pad)+'" x2="'+(W-pad)+'" y2="'+(H-pad)+'" stroke="#DEE6ED"/><path d="'+path+'" fill="none" stroke="#4F8CBF" stroke-width="2.5"/>'+dots+'</svg>';
}

/* ============ 记录统计首页 ============ */
function countRecords(sub,range){
  const arr=db.records[sub]||[];
  const now=new Date();
  if(range==='week'){
    const dow=(now.getDay()+6)%7;
    const mon=new Date(now); mon.setDate(now.getDate()-dow); mon.setHours(0,0,0,0);
    return arr.filter(x=>x.date && new Date(x.date)>=mon).length;
  }
  if(range==='month'){
    const y=now.getFullYear(), m=now.getMonth();
    return arr.filter(x=>x.date && new Date(x.date).getFullYear()===y && new Date(x.date).getMonth()===m).length;
  }
  if(range==='year'){
    const y=now.getFullYear();
    return arr.filter(x=>x.date && new Date(x.date).getFullYear()===y).length;
  }
  return arr.length;
}
function recordMonthBars(){
  const y=new Date().getFullYear();
  const recMod=db.modules.find(m=>m.id==='records');
  const types=(recMod?recMod.subs:[]).map(s=>({k:s.id,name:s.name,color:(REC_META[s.id]||{color:'#888'}).color}));
  const months=[];
  for(let i=1;i<=12;i++){
    const ym=y+'-'+String(i).padStart(2,'0');
    let total=0;
    const stack=types.map(t=>{
      const c=(db.records[t.k]||[]).filter(x=>x.date && x.date.slice(0,7)===ym).length;
      total+=c;
      return {c,color:t.color};
    });
    months.push({m:i,total,stack});
  }
  const max=Math.max(...months.map(x=>x.total),1);
  const bars=months.map(x=>{
    const segs=x.stack.map(s=>s.c>0?'<div style="width:100%;height:'+Math.max(2,Math.round(s.c/max*100))+'px;background:'+s.color+';border-radius:2px"></div>':'').join('');
    return '<div style="flex:1;text-align:center;min-width:28px"><div style="height:120px;display:flex;flex-direction:column-reverse;justify-content:flex-start;align-items:center;gap:2px">'+segs+'</div><div class="mini" style="margin-top:6px">'+x.m+'月</div><div style="font-size:11px;font-weight:700">'+x.total+'</div></div>';
  }).join('');
  return '<div style="display:flex;align-items:flex-end;gap:6px;padding:8px 0;overflow-x:auto">'+bars+'</div>';
}
function renderRecords(){
  const range=state.recRange||'month';
  const recMod=db.modules.find(m=>m.id==='records');
  const recSubs=recMod?recMod.subs:[];
  const types=recSubs.map(s=>({k:s.id,name:s.name,unit:(REC_META[s.id]||{unit:''}).unit})).concat([{k:'reading',name:'阅读',unit:'本',src:true}]);
  const counts=types.map(t=>t.src?db.reading.books.length:countRecords(t.k,range));
  const tabs=[['week','本周'],['month','本月'],['year','本年']].map(v=>'<button class="tab'+(range===v[0]?' active':'')+'" data-recrange="'+v[0]+'">'+v[1]+'</button>').join('');
  const cards=types.map((t,i)=>{
    return '<div class="stat rec-stat" data-gosub="records:'+t.k+'"><div class="num">'+counts[i]+'</div><div class="lab">'+t.name+'</div><div class="mini">'+t.unit+'</div></div>';
  }).join('');
  const pieData=types.map((t,i)=>({name:t.name,amount:counts[i]})).filter(x=>x.amount>0);
  const pie=pieData.length>1?'<div class="card"><div class="section-title">类型占比</div>'+pieChart(pieData)+'</div>':'';
  const bars=recordMonthBars();
  // 本月精选回忆
  const picks=[];
  const pickTypes=recSubs.map(s=>({k:s.id,name:s.name}));
  pickTypes.forEach(t=>{
    const arr=(db.records[t.k]||[]).filter(x=>x.rate);
    if(!arr.length) return;
    arr.sort((a,b)=>Number(b.rate)-Number(a.rate));
    const best=arr[0];
    picks.push('<div class="list-item" style="align-items:center"><div class="rec-thumb">'+(best.img?'<img src="'+esc(best.img)+'">':'<div class="rec-thumb-empty">'+t.name+'</div>')+'</div><div class="body"><div style="font-weight:700">'+esc(best.name||'未命名')+'</div><div class="meta"><span>'+t.name+'</span><span class="pill in">'+esc(best.rate)+'分</span></div></div></div>');
  });
  if(db.reading.books.length){
    const bestBook=[...db.reading.books].sort((a,b)=>((b.current/(b.total||1))-(a.current/(a.total||1))))[0];
    picks.push('<div class="list-item" style="align-items:center"><div class="rec-thumb"><div class="rec-thumb-empty">书</div></div><div class="body"><div style="font-weight:700">'+esc(bestBook.title||'未命名')+'</div><div class="meta"><span>阅读</span><span class="pill in">'+Math.round(bestBook.current/(bestBook.total||1)*100)+'%</span></div></div></div>');
  }
  const pickHtml=picks.length?'<div class="card"><div class="section-title">本月精选回忆</div>'+picks.join('')+'</div>':'';
  return '<div class="card"><div class="section-title">'+I.rec+' 记录统计</div><div class="tabs">'+tabs+'</div><div class="rec-types">'+cards+'</div></div>'+pie+'<div class="card"><div class="section-title">月度记录趋势</div>'+bars+'</div>'+pickHtml;
}
function renderRecordSub(sub){
  const recMod=db.modules.find(m=>m.id==='records');
  if(recMod && recMod.subs.some(s=>s.id===sub)) return renderRecordGallery('records',sub);
  return renderGeneric('records',sub);
}
function compressImg(file,maxWidth){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=e=>{
      const img=new Image();
      img.onload=()=>{
        const canvas=document.createElement('canvas');
        const w=Math.min(maxWidth||800, img.width);
        const h=Math.round(img.height*w/img.width);
        canvas.width=w; canvas.height=h;
        const ctx=canvas.getContext('2d');
        ctx.fillStyle='#fff'; ctx.fillRect(0,0,w,h);
        ctx.drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg',0.85));
      };
      img.onerror=reject;
      img.src=e.target.result;
    };
    reader.onerror=reject;
    reader.readAsDataURL(file);
  });
}
function renderRecordGallery(top,sub){
  const arr=db.records[sub]||[];
  const nameMap={video:'影视',drink:'饮品',food:'美食',travel:'旅游'};
  const unitMap={video:'部',drink:'杯',food:'家',travel:'次'};

function renderGeneric(top,sub){
  const cfg=fieldCfg(top,sub);
  const arr=getArr(top,sub);
  let extra='';
  if(top==='english'&&sub==='words'){
    extra='<div class="row" style="margin-bottom:12px"><label class="fld" style="flex:0 0 200px"><span>按熟练度筛选</span><select id="lvFilter"><option value="">全部</option><option>入门</option><option>熟悉</option><option>掌握</option></select></label></div>';
  }
  const form='<form data-gen="'+top+':'+sub+'"><div class="row">'+cfg.map(f=>fieldHTML(f)).join('')+
    '<button class="btn primary" type="button" data-submit="1" style="flex:0 0 auto">添加</button></div></form>';
  const filterVal=document.getElementById('lvFilter')?document.getElementById('lvFilter').value:'';
  let listArr=arr;
  if(top==='english'&&sub==='words'&&filterVal) listArr=arr.filter(x=>x.lv===filterVal);
  let list=listArr.map(x=>{
    let body=cfg.map(f=>{ let v=x[f.k]; if(f.t==='sel'&&f.k==='rate'&&v) return '<span class="pill '+(Number(v)>=4?'in':'low')+'">'+esc(v)+'分</span>'; return (v!==''&&v!=null)?'<span>'+esc(f.l)+'：'+esc(v)+'</span>':''; }).filter(Boolean).join('');
    if(top==='work'&&sub==='homework'&&x.should!=null){
      const r=x.should>0?Math.round(x.actual/x.should*100):0;
      body+='<span class="pill '+(r>=100?'in':'low')+'">完成率 '+r+'%</span>';
    }
    return '<div class="list-item"><div class="body">'+body+'</div>'+
      '<button class="btn sm danger" data-delgen="'+top+':'+sub+':'+x.id+'">删除</button></div>';
  }).join('');
  if(!list) list='<div class="empty">还没有记录，添加第一条吧</div>';
  return '<div class="card">'+extra+form+'</div><div class="card"><div class="section-title">'+esc(findSubName(top,sub))+'（'+arr.length+'）</div>'+list+'</div>';
}
function fieldHTML(f){
  if(f.t==='area') return '<label class="fld" style="flex:2"><span>'+esc(f.l)+'</span><textarea data-key="'+f.k+'" rows="2"></textarea></label>';
  if(f.t==='num') return '<label class="fld"><span>'+esc(f.l)+'</span><input data-key="'+f.k+'" type="number"></label>';
  if(f.t==='date') return '<label class="fld"><span>'+esc(f.l)+'</span><input data-key="'+f.k+'" type="date" value="'+(f.k==='date'?todayISO():'')+'"></label>';
  if(f.t==='sel') return '<label class="fld"><span>'+esc(f.l)+'</span><select data-key="'+f.k+'">'+f.o.map(o=>'<option>'+esc(o)+'</option>').join('')+'</select></label>';
  return '<label class="fld"><span>'+esc(f.l)+'</span><input data-key="'+f.k+'" type="text"></label>';
}
function fld(k,l,t){ return fieldHTML({k,l,t}); }

function pieChart(items){
  const total=items.reduce((s,x)=>s+x.amount,0); const W=200; const cx=100,cy=100,r=80;
  const colors=['#1F3A52','#4F8CBF','#2E8B6F','#d9912b','#5b8fb0','#c97b9c','#7a9e7e'];
  let ang=-Math.PI/2, paths='';
  items.forEach((it,i)=>{ const frac=it.amount/total; const a2=ang+frac*Math.PI*2;
    const x1=cx+r*Math.cos(ang),y1=cy+r*Math.sin(ang),x2=cx+r*Math.cos(a2),y2=cy+r*Math.sin(a2);
    const large=frac>0.5?1:0;
    paths+='<path d="M'+cx+','+cy+' L'+x1.toFixed(1)+','+y1.toFixed(1)+' A'+r+','+r+' 0 '+large+' 1 '+x2.toFixed(1)+','+y2.toFixed(1)+' Z" fill="'+colors[i%colors.length]+'"/>';
    ang=a2;
  });
  let legend=items.map((it,i)=>'<div style="display:flex;align-items:center;gap:6px;font-size:12px;margin:2px 0"><span style="width:10px;height:10px;border-radius:3px;background:'+colors[i%colors.length]+'"></span>'+esc(it.name)+' '+fmtMoney(it.amount)+'</div>').join('');
  return '<div style="display:flex;gap:18px;align-items:center;flex-wrap:wrap"><svg viewBox="0 0 200 200" width="180" height="180">'+paths+'<circle cx="100" cy="100" r="42" fill="#fff"/></svg><div>'+legend+'</div></div>';
}

  c.querySelectorAll('.quad-list').forEach(el=>{
    el.addEventListener('dragover',e=>{ e.preventDefault(); e.dataTransfer.dropEffect='move'; el.classList.add('dragover'); });
    el.addEventListener('dragleave',e=>{ el.classList.remove('dragover'); });
    el.addEventListener('drop',e=>{ e.preventDefault(); el.classList.remove('dragover'); if(!dragState) return; reorderPlan(dragState.sub); dragState=null; });
  });
  const lv=document.getElementById('lvFilter'); if(lv) lv.onchange=()=>render();
}
function handleForm(f){
  if(f.dataset.plan){ const sub=f.dataset.plan; const g=k=>f.querySelector('[data-key="'+k+'"]').value;
    const rec={id:uid(),title:g('title'),desc:g('desc'),progress:Number(g('progress'))||0,done:false};
    if(sub==='daily'){
      rec.start=g('start')||''; rec.end=g('end')||''; rec.due='';
      rec.quadrant=g('quadrant')||'ninu';
      rec.prio=rec.quadrant==='iu'?'high':rec.quadrant==='inu'?'mid':'low';
    } else {
      rec.sdate=g('sdate')||''; rec.due=g('due')||'';
      if(sub==='weekly'){
        rec.quadrant=g('quadrant')||'ninu';
        rec.prio=rec.quadrant==='iu'?'high':rec.quadrant==='inu'?'mid':'low';
      } else {
        rec.prio=g('prio')||'mid';
      }
    }
    db.plan[sub].push(rec); saveDB(); render(); return; }
  if(f.dataset.exam){ const g=f=>f.querySelector('[data-key="'+f+'"]').value;
    db.work.exam.push({id:uid(),name:g('name'),cls:g('cls'),avg:Number(g('avg'))||0,max:Number(g('max'))||0,pass:Number(g('pass'))||0}); saveDB(); render(); return; }
  if(f.dataset.gen){ const [top,sub]=f.dataset.gen.split(':'); const cfg=fieldCfg(top,sub); const rec={id:uid()};
    cfg.forEach(c=>{ rec[c.k]=f.querySelector('[data-key="'+c.k+'"]').value; });
    getArr(top,sub).push(rec); saveDB(); render(); return; }
  if(f.dataset.recform){ const sub=f.dataset.recform; const g=k=>f.querySelector('[data-key="'+k+'"]').value;
    db.records[sub].push({id:uid(),name:g('name'),date:g('date'),place:g('place'),rate:g('rate'),feel:g('feel'),img:g('img')}); saveDB(); render(); return; }
  if(f.dataset.book){ const g=f=>f.querySelector('[data-key="'+f+'"]').value;
    db.reading.books.push({id:uid(),title:g('title'),author:g('author'),total:Number(g('total'))||0,current:Number(g('current'))||0}); saveDB(); render(); return; }
  if(f.dataset.bill){ const g=f=>f.querySelector('[data-key="'+f+'"]').value;
    db.finance.bills.push({id:uid(),type:g('type'),amount:Number(g('amount'))||0,cate:g('cate'),date:g('date')||todayISO(),note:g('note')}); saveDB(); render(); return; }
  if(f.dataset.budget){ const g=f=>f.querySelector('[data-key="'+f+'"]').value;
    db.finance.budgets.push({id:uid(),cate:g('cate'),month:Number(g('month'))||new Date().getMonth()+1,budget:Number(g('budget'))||0}); saveDB(); render(); return; }
  if(f.dataset.setbudget){ const g=f=>f.querySelector('[data-key="'+f+'"]').value;
    const m=new Date().getMonth()+1;
    db.finance.budgets=db.finance.budgets.filter(b=>b.month!==m);
    const v=Number(g('budget'))||0;
    if(v>0) db.finance.budgets.push({id:uid(),cate:'总预算',month:m,budget:v});
    state.showBudgetForm=false; saveDB(); render(); toast('预算已保存'); return; }
  if(f.dataset.addexpense){
    const amount=Number(document.getElementById('expAmount').value)||0;
    const date=document.getElementById('expDate').value||todayISO();
    const note=document.getElementById('expNote').value;
    if(amount>0){
      const cate=EXPENSE_CATES.find(c=>c.id===state.expCate)?.name||'其他';
      db.finance.bills.push({id:uid(),type:'expense',amount,cate,date,note});
      state.expCate=''; saveDB(); render(); toast('支出已记录');
    }
    return; }
  if(f.dataset.addincome){
    const amount=Number(document.getElementById('incAmount').value)||0;
    const date=document.getElementById('incDate').value||todayISO();
    const note=document.getElementById('incNote').value;
    if(amount>0){
      const cate=INCOME_CATES.find(c=>c.id===state.incCate)?.name||'其他';
      db.finance.bills.push({id:uid(),type:'income',amount,cate,date,note});
      state.incCate=''; saveDB(); render(); toast('收入已记录');
    }
    return; }
  if(f.dataset.save){ const g=f=>f.querySelector('[data-key="'+f+'"]').value;
    db.finance.savings.push({id:uid(),name:g('name'),target:Number(g('target'))||0,saved:Number(g('saved'))||0}); saveDB(); render(); return; }
  if(f.dataset.asset){ const g=f=>f.querySelector('[data-key="'+f+'"]').value;
    db.finance.assets.push({id:uid(),name:g('name'),amount:Number(g('amount'))||0,kind:g('kind')}); saveDB(); render(); return; }
  if(f.dataset.happy){ const g=f=>f.querySelector('[data-key="'+f+'"]').value;
    db.happiness.push({id:uid(),text:g('text'),date:g('date')||todayISO(),mood:g('mood')}); saveDB(); render(); return; }
  if(f.dataset.cd){ const g=f=>f.querySelector('[data-key="'+f+'"]').value; const cb=f.querySelector('[data-key="repeat"]');
    db.countdowns.push({id:uid(),name:g('name'),date:g('date'),repeat:cb?cb.checked:false}); saveDB(); render(); return; }
  if(f.dataset.memo){ const g=f=>f.querySelector('[data-key="'+f+'"]').value;
    db.memo.push({id:uid(),title:g('title')||'未命名',content:g('content')||'',date:todayISO()}); saveDB(); render(); return; }
}

/* ============ 侧边栏自定义 ============ */
function openCustom(){
  const box=document.getElementById('modalBox');
  box.innerHTML='<h3>自定义工作台</h3>'+
    '<p class="mini">新增一级模块或子模块，所有改动自动保存。删除会同时清除对应数据。</p>'+
    '<div class="card" style="margin-bottom:14px"><div class="section-title">新增一级模块</div>'+
      '<div class="row"><input id="newModName" placeholder="模块名称，如"副业"">'+
      '<button class="btn primary" id="addMod" style="flex:0 0 auto">添加</button></div></div>'+
    '<div class="card" style="margin-bottom:14px"><div class="section-title">为已有模块新增子模块</div>'+
      '<div class="row"><select id="parentMod">'+db.modules.map(m=>'<option value="'+m.id+'">'+esc(m.name)+'</option>').join('')+'</select>'+
      '<input id="newSubName" placeholder="子模块名称">'+
      '<button class="btn primary" id="addSub" style="flex:0 0 auto">添加</button></div></div>'+
    '<div style="text-align:right"><button class="btn ghost" id="closeModal">关闭</button></div>';
  document.getElementById('modalMask').classList.add('open');
  document.getElementById('closeModal').onclick=closeModal;
  document.getElementById('addMod').onclick=()=>{ const n=document.getElementById('newModName').value.trim(); if(!n){toast('请输入名称');return;}
    db.modules.push({id:'m_'+uid(),name:n,icon:'rec',subs:[]}); db.custom['m_'+ (db.modules[db.modules.length-1].id.slice(2))]={}; saveDB(); render(); toast('已添加模块'); closeModal(); };
  document.getElementById('addSub').onclick=()=>{ const pid=document.getElementById('parentMod').value; const n=document.getElementById('newSubName').value.trim(); if(!n){toast('请输入名称');return;}
    const m=db.modules.find(x=>x.id===pid); if(m){ const sid='s_'+uid(); m.subs.push({id:sid,name:n}); if(!db[pid]) db[pid]={}; db[pid][sid]=[]; saveDB(); render(); toast('已添加子模块'); closeModal(); } };
}
function closeModal(){ document.getElementById('modalMask').classList.remove('open'); }
function resetDefault(){ if(!confirm('恢复默认模块结构？自定义内容将被清空，内置数据保留。')) return;
  db.modules=defaultModules(); saveDB(); state={top:'home',sub:null,heat:'week',calMonth:new Date(),monthView:'cal',billDate:todayISO(),billType:'expense',billCate:'餐饮',showCdAdd:false,enItem:'reading',enMonth:new Date(),recRange:'month',billFilter:'all',expCate:'',incCate:''}; render(); toast('已恢复默认'); }

/* ============ 备份 ============ */
function exportDB(){ const data=JSON.stringify(db,null,2); const blob=new Blob([data],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='workbuddy-backup-'+todayISO()+'.json'; a.click(); toast('已导出备份'); }
function importDB(file){ const r=new FileReader(); r.onload=()=>{ try{ const d=JSON.parse(r.result); if(!d.modules) throw 0;
  db=d; if(!db.custom)db.custom={}; saveDB(true); render(); toast('导入成功，数据已恢复'); }catch(e){ toast('文件格式不正确'); } }; r.readAsText(file); }

/* ============ 在线状态 ============ */
function updateNet(){ const on=navigator.onLine; const b=document.getElementById('netBadge'); const t=document.getElementById('netText');
  if(on){ b.classList.remove('off'); t.textContent='在线'; } else { b.classList.add('off'); t.textContent='离线'; } }
window.addEventListener('online',updateNet); window.addEventListener('offline',updateNet);

/* ============ 侧边栏移动端 ============ */
function openSidebar(){ document.getElementById('sidebar').classList.add('open'); document.getElementById('scrim').classList.add('open'); }
function closeSidebar(){ document.getElementById('sidebar').classList.remove('open'); document.getElementById('scrim').classList.remove('open'); }

/* ============ 版本与更新 ============ */
const BUILD='20260804.3';
function showVersion(){
  let tag=document.getElementById('verTag');
  if(!tag){
    tag=document.createElement('div'); tag.id='verTag';
    tag.style.cssText='position:fixed;right:8px;bottom:8px;z-index:9999;background:rgba(31,58,82,.85);color:#fff;font-size:11px;padding:4px 8px;border-radius:8px;cursor:pointer;display:flex;gap:6px;align-items:center;box-shadow:0 2px 8px rgba(0,0,0,.2)';
    tag.innerHTML='<span>v'+BUILD+'</span><span style="text-decoration:underline;opacity:.85">强制刷新</span>';
    document.body.appendChild(tag);
    tag.onclick=()=>{ location.reload(true); };
  }
}
function initSW(){
  if(!('serviceWorker' in navigator)) return;
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('sw.js').then(reg=>{
      reg.addEventListener('updatefound',()=>{
        const nw=reg.installing; if(!nw) return;
        nw.addEventListener('statechange',()=>{ if(nw.state==='installed'&&navigator.serviceWorker.controller) location.reload(); });
      });
      if(reg.waiting&&navigator.serviceWorker.controller) reg.waiting.postMessage({type:'SKIP_WAITING'});
    }).catch(()=>{});
  });
  let reloading=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{ if(!reloading){ reloading=true; location.reload(); } });
}

/* ============ 初始化 ============ */
function init(){
  loadDB();
  document.getElementById('hamburger').onclick=openSidebar;
  document.getElementById('scrim').onclick=closeSidebar;
  document.getElementById('btnExport').onclick=exportDB;
  document.getElementById('btnImport').onclick=()=>document.getElementById('fileInput').click();
  document.getElementById('fileInput').onchange=e=>{ if(e.target.files[0]) importDB(e.target.files[0]); e.target.value=''; };
  document.getElementById('btnCustom').onclick=openCustom;
  document.getElementById('btnReset').onclick=resetDefault;
  document.getElementById('modalMask').onclick=e=>{ if(e.target.id==='modalMask') closeModal(); };
  updateNet();
  render();
  startClock();
  showVersion();
  initSW();
}
init();
</script>
